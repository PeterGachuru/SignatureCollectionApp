<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Debt Ageing Analysis</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}"/>

    <th:block th:replace="~{fragments/header :: header-css}"></th:block>

    <style>

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        th,td{
            border:1px solid #ddd;
            padding:8px;
        }

        th{
            background:#f4f4f4;
        }

        tr:hover{
            background:#fafafa;
        }

        input{

            width:300px;
            padding:7px;
            margin-top:10px;
            margin-bottom:10px;

        }

        .btn{

            text-decoration:none;
            color:white;
            background:#2196F3;
            padding:8px 15px;
            border-radius:4px;

        }

        .summary{

            display:flex;
            gap:40px;
            margin-top:20px;
            margin-bottom:20px;

        }

        .summary div{

            background:#f7f7f7;
            padding:10px;
            border-radius:5px;

        }

    </style>

    <script>

        function searchCustomers(){

            let filter =
                    document.getElementById("search")
                    .value.toLowerCase();

            let rows =
                    document.getElementsByClassName("record");

            for(let i=0;i<rows.length;i++){

                rows[i].style.display =
                    rows[i].innerText.toLowerCase().includes(filter)
                    ? ""
                    : "none";
            }

        }

    </script>

</head>

<body>

<div th:replace="fragments/header :: header"></div>

<h2>

    Debt Ageing Analysis

</h2>

<a
        class="btn"
        th:href="@{/debt-ageing}">

    ← Back

</a>

<div class="summary">

    <div>

        <b>Report Date</b>

        <br>

        <span
                th:text="${upload.reportDate}"></span>

    </div>

    <div>

        <b>Customers</b>

        <br>

        <span
                th:text="${upload.totalRecords}"></span>

    </div>

    <div>

        <b>Total Debt</b>

        <br>

        <span
                th:text="${#numbers.formatDecimal(upload.totalDebt,1,'COMMA',2,'POINT')}"></span>

    </div>

</div>

<input
        id="search"
        onkeyup="searchCustomers()"
        placeholder="Search customer...">

<table>

    <thead>

    <tr>

        <th>Customer Code</th>
        <th>Customer</th>
        <th>Current</th>
        <th>30 Days</th>
        <th>60 Days</th>
        <th>90 Days</th>
        <th>120 Days</th>
        <th>Total Debt</th>

    </tr>

    </thead>

    <tbody>

    <tr
            class="record"
            th:each="record : ${records}">

        <td>
                <a th:href="@{/admin/customers/view/{customerId}(customerId=${record.customer.id})}"
                   th:text="${record.customer.customerCode}"
                   style="font-weight:600; color:#2196F3; text-decoration:none;"></a>
            </td>

        <td>
                <a th:href="@{/admin/customers/view/{customerId}(customerId=${record.customer.id})}"
                   th:text="${record.customer.businessName}"
                   style="color:#2196F3; text-decoration:none;"></a>
            </td>

        <td
                th:text="${#numbers.formatDecimal(record.currentAmount,1,'COMMA',2,'POINT')}"></td>

        <td
                th:text="${#numbers.formatDecimal(record.days30,1,'COMMA',2,'POINT')}"></td>

        <td
                th:text="${#numbers.formatDecimal(record.days60,1,'COMMA',2,'POINT')}"></td>

        <td
                th:text="${#numbers.formatDecimal(record.days90,1,'COMMA',2,'POINT')}"></td>

        <td
                th:text="${#numbers.formatDecimal(record.days120,1,'COMMA',2,'POINT')}"></td>

        <td
                th:text="${#numbers.formatDecimal(record.totalDebt,1,'COMMA',2,'POINT')}"></td>

    </tr>

    </tbody>

</table>

</body>

</html>
