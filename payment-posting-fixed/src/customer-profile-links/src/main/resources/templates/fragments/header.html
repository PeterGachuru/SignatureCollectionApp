<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ===== HEADER CSS FRAGMENT ===== -->
<head th:fragment="header-css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }


        /* HEADER */
        .header {
            background-color: #004080;
            color: white;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        /* LOGO */
        .logo {
            font-weight: bold;
            font-size: 1.25em;
        }

        .logo a {
            color:white;
            text-decoration:none;
        }


        /* NAVIGATION */
        .nav {
            display:flex;
            align-items:center;
            gap:10px;
        }


        .nav a {
            color:white;
            text-decoration:none;
            padding:8px 12px;
            border-radius:4px;
            white-space:nowrap;
        }


        .nav a:hover {
            background-color:#0066cc;
        }


        /* LOGOUT BUTTON */
        .logout-btn {
            background:none;
            border:none;
            color:white;
            cursor:pointer;
            font-weight:bold;
            font-size:14px;
        }


        /* HAMBURGER */
        .menu-toggle {
            display:none;
            font-size:28px;
            cursor:pointer;
        }


        /* MOBILE MENU */
        #menu-checkbox {
            display:none;
        }


        /* MOBILE RESPONSIVENESS */
        @media(max-width:900px){

            .header {
                flex-wrap:wrap;
                padding:12px 16px;
            }


            .logo {
                font-size:1.1em;
                max-width:75%;
            }


            .menu-toggle {
                display:block;
            }


            .nav {

                width:100%;
                display:none;
                flex-direction:column;
                align-items:stretch;
                margin-top:15px;
                gap:0;
            }


            #menu-checkbox:checked ~ .nav {
                display:flex;
            }


            .nav a {

                padding:12px;
                border-radius:0;
                border-bottom:1px solid rgba(255,255,255,.2);
            }


            .nav span {

                padding:12px;
                border-bottom:1px solid rgba(255,255,255,.2);
            }


            .logout-btn {

                padding:0;
            }

        }


        /* VERY SMALL PHONES */
        @media(max-width:400px){

            .logo {
                font-size:1em;
            }

            .menu-toggle {
                font-size:24px;
            }

        }


    </style>

</head>



<!-- ===== HEADER HTML FRAGMENT ===== -->
<body>

<div th:fragment="header">

    <div class="header">


        <!-- LOGO -->
        <div class="logo">
            <a th:href="@{/}">
                Signature Care Collection App
            </a>
        </div>


        <!-- MOBILE MENU BUTTON -->
        <label class="menu-toggle" for="menu-checkbox">
            ☰
        </label>


        <input type="checkbox" id="menu-checkbox">


        <!-- NAVIGATION -->
        <div class="nav">


            <a th:href="@{/admin/customers/list}">
                Customers
            </a>


            <a th:href="@{/debt-ageing}">
                Aging Debt
            </a>


<!--            <a th:href="@{/credit-sales/list}">-->
<!--                Credit Sales-->
<!--            </a>-->

            <a>
                Orders
            </a>


            <a th:href="@{/admin/payments}">
                Payments
            </a>


            <a th:href="@{/config}">
                Configs
            </a>


            <a th:href="@{/admin/users}">
                Users
            </a>



            <!-- AUTHENTICATED USER -->
            <span th:if="${#authentication != null and #authorization.expression('isAuthenticated()')}">


            <a th:text="${#authentication.name}"
               th:href="@{/profile}">
                Username
            </a>


            <form th:action="@{/logout}" method="post"
                  style="display:inline;">

                <button class="logout-btn"
                        type="submit">
                    Logout
                </button>

            </form>


        </span>



            <!-- NOT AUTHENTICATED -->
            <span th:if="${#authentication == null or !#authorization.expression('isAuthenticated()')}">

            <a th:href="@{/login}">
                Login
            </a>

        </span>


        </div>


    </div>

</div>

</body>
</html>
