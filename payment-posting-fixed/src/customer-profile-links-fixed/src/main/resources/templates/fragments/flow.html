<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="flowNode(node, level)">
    <div class="flow-level">
        <div class="flow-card">
            <h4 th:text="${node?.name ?: 'Unknown'}"></h4>
            <h5 style="margin:2px; padding:2px"  th:text="${'(Level ' + level + ')'}"></h5>

            <div class="flow-meta">
                <span th:text="${node?.clientSystem?.name}"></span>
                →
                <span th:text="${node?.serverSystem?.name}"></span>

                <span ><a th:href="@{/systems/{id}(id=${node?.clientSystem?.id})}"
                          th:text="${node?.clientSystem?.name}"></a></span>
                →
                <span ><a th:href="@{/systems/{id}(id=${node?.serverSystem?.id})}"
                          th:text="${node?.serverSystem?.name}"></a></span>
            </div>

            <code th:text="${node?.serverSystem?.endpoint}"></code><br/>
            <code th:text="${node?.endpointUrl}"></code>
            <br/>
            <a th:href="@{/integrations/{id}(id=${node?.id})}">View</a> | <a th:href="@{/integrations/edit/{id}(id=${node?.id})}" class="btn-edit"> Edit </a>

        </div>

        <div th:if="${!#lists.isEmpty(node?.dependencies)}"
             th:each="childDep : ${node?.dependencies}">
            <div class="flow-arrow-vertical">
                <span class="arrow-down">↓</span>
                <span class="arrow-up">↑</span>
            </div>
            <div th:replace="~{fragments/flow :: flowNode(node=${childDep.child}, level=${level + 1})}"></div>

        </div>
    </div>
</th:block>

</body>
</html>
