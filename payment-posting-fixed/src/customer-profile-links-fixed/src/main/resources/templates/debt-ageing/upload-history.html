<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Debt Ageing Upload History</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}"/>

    <th:block th:replace="~{fragments/header :: header-css}"></th:block>

    <style>

        table{

            width:100%;
            border-collapse:collapse;
            margin-top:20px;

        }

        th,td{

            border:1px solid #ddd;
            padding:8px;

        }

        th{

            background:#f5f5f5;

        }

        tr:hover{

            background:#fafafa;

        }

        .btn{

            padding:8px 14px;

            border-radius:4px;

            text-decoration:none;

            color:white;

        }

        .green{

            background:#4CAF50;

        }

        .blue{

            background:#2196F3;

        }

        .success{

            color:green;

            margin-bottom:15px;

        }

        .error{

            color:red;

            margin-bottom:15px;

        }

    </style>

</head>

<body>

<div th:replace="fragments/header :: header"></div>

<h2>

    Debt Ageing Upload History

</h2>

<div
        th:if="${success}"
        class="success">

    <span th:text="${success}"></span>

</div>

<div
        th:if="${error}"
        class="error">

    <span th:text="${error}"></span>

</div>

<p>

    <a
            th:href="@{/debt-ageing/upload}"
            class="btn green">

        + Upload New Analysis

    </a>

</p>

<table>

    <thead>

    <tr>

        <th>Report Date</th>

        <th>File Name</th>

        <th>Uploaded By</th>

        <th>Uploaded On</th>

        <th>Customers</th>

        <th>Total Debt</th>

        <th>Action</th>

    </tr>

    </thead>

    <tbody>

    <tr
            th:each="upload : ${uploads}">

        <td
                th:text="${upload.reportDate}"></td>

        <td
                th:text="${upload.fileName}"></td>

        <td
                th:text="${upload.uploadedBy}"></td>

        <td
                th:text="${#temporals.format(upload.uploadedAt,'dd-MMM-yyyy HH:mm')}"></td>

        <td
                th:text="${upload.totalRecords}"></td>

        <td
                th:text="${#numbers.formatDecimal(upload.totalDebt,1,'COMMA',2,'POINT')}"></td>

        <td>

            <a
                    class="btn blue"
                    th:href="@{/debt-ageing/{id}/records(id=${upload.id})}">

                View Analysis

            </a>

        </td>

    </tr>

    </tbody>

</table>

</body>

</html>
