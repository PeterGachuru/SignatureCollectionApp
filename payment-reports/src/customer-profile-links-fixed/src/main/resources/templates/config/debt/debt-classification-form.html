<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Debt Classification</title>
    <th:block th:replace="~{fragments/header :: header-css}"></th:block>
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<h2 th:text="${classification.id == null ? 'New' : 'Edit'} + ' Debt Classification'"></h2>

<form th:action="@{/config/debt-classifications/save}"
      th:object="${classification}"
      method="post">

    <input type="hidden" th:field="*{id}"/>

    <label>Name *</label>
    <input type="text" th:field="*{name}" required/>

    <label>Min Days Late *</label>
    <input type="number" th:field="*{minDaysLate}" required/>

    <label>Max Days Late</label>
    <input type="number" th:field="*{maxDaysLate}"/>
    <small>Leave empty for open-ended (e.g. 181+)</small>

    <label>
        <input type="checkbox" th:field="*{active}"/> Active
    </label>

    <br/><br/>

    <button type="submit">Save</button>
    <a th:href="@{/config/debt-classifications}">Cancel</a>
</form>

</body>
</html>
