<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Bank Management</title>

    <th:block th:replace="~{fragments/header :: header-css}"></th:block>

    <link rel="stylesheet"
          th:href="@{/css/style.css}" />

    <style>

        .container {
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 9px;
        }

        th {
            background: #f5f5f5;
        }

        input {
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        .success {
            color: green;
            margin-bottom: 15px;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .inactive {
            color: red;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div th:replace="fragments/header :: header"></div>

<div class="container">

    <h2>Bank Management</h2>

    <div th:if="${success}" class="success"
         th:text="${success}">
    </div>

    <div th:if="${error}" class="error"
         th:text="${error}">
    </div>

    <div class="card">

        <h3>Add Bank</h3>

        <form th:action="@{/config/banks/save}"
              th:object="${bank}"
              method="post">

            <label>Bank Code</label>

            <br/>

            <input type="text"
                   th:field="*{code}"
                   placeholder="e.g. KCB"
                   required/>

            <br/><br/>

            <label>Bank Name</label>

            <br/>

            <input type="text"
                   th:field="*{name}"
                   placeholder="e.g. Kenya Commercial Bank"
                   required/>

            <br/><br/>

            <button type="submit">
                Save Bank
            </button>

        </form>

    </div>

    <div class="card">

        <h3>Banks</h3>

        <table>

            <thead>

            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="bank : ${banks}">

                <td th:text="${bank.code}"></td>

                <td th:text="${bank.name}"></td>

                <td>

                    <span th:if="${bank.active}"
                          class="active">
                        Active
                    </span>

                    <span th:unless="${bank.active}"
                          class="inactive">
                        Inactive
                    </span>

                </td>

                <td>

                    <form th:action="@{/config/banks/{id}/toggle(id=${bank.id})}"
                          method="post">

                        <button type="submit"
                                th:text="${bank.active ? 'Deactivate' : 'Activate'}">
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
