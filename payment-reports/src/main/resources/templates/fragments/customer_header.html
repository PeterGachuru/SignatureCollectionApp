<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="header-css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #004080;
            color: white;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: bold;
            font-size: 1.25em;
        }

        .nav {
            display: flex;
            gap: 12px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
        }

        .nav a:hover {
            background-color: #0066cc;
        }

        .dropdown {
            position: relative;
        }

        .dropbtn {
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #004080;
            min-width: 180px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .dropdown-content a {
            padding: 10px 14px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>

<!-- ===== HEADER HTML FRAGMENT ===== -->
<body>
<div th:fragment="header">
    <div class="header">
        <div class="logo">
            Signature Care Collection App
        </div>

        <div class="nav">
            <a th:href="@{/customer/credit-sales/list}">Credit Sales</a>
            <a th:href="@{/customer/payments}">Payments</a>
            <span  th:if="${#authentication != null and #authorization.expression('isAuthenticated()')}">
                <span>
                     <a th:text="${#authentication.name}" th:href="@{/profile}" style="color:white; text-decoration:none;">Username</a></span> |
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:bold;">
                        Logout
                    </button>
                </form>
            </span>
            <span th:if="${#authentication == null or !#authorization.expression('isAuthenticated()')}">
                <a th:href="@{/login}" style="color:white; text-decoration:none;">Login</a>
            </span>
        </div>
    </div>
</div>
</body>
</html>
