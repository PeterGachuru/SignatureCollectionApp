<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Signature Care Collection App</title>

    <style>
        /* Reset */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
            background:linear-gradient(135deg,#004080,#0066cc);
        }

        .login-container{
            width:100%;
            max-width:420px;
            background:#fff;
            border-radius:14px;
            padding:35px;
            box-shadow:0 12px 35px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            color:#004080;
            margin-bottom:30px;
            font-size:28px;
            line-height:1.3;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#333;
            font-weight:bold;
            font-size:15px;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            margin-bottom:20px;
            transition:.3s;
        }

        input:focus{
            outline:none;
            border-color:#004080;
            box-shadow:0 0 6px rgba(0,64,128,.3);
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:8px;
            background:#004080;
            color:white;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#0066cc;
        }

        button:active{
            transform:scale(.98);
        }

        .footer{
            margin-top:25px;
            text-align:center;
            color:#777;
            font-size:13px;
        }

        /* Tablet */
        @media (max-width:768px){

            .login-container{
                max-width:500px;
                padding:30px;
            }

            h1{
                font-size:24px;
            }

        }

        /* Mobile */
        @media (max-width:480px){

            body{
                padding:15px;
                align-items:center;
            }

            .login-container{
                padding:25px 20px;
                border-radius:10px;
            }

            h1{
                font-size:22px;
                margin-bottom:25px;
            }

            label{
                font-size:14px;
            }

            input{
                font-size:16px;
                padding:13px;
            }

            button{
                padding:14px;
                font-size:16px;
            }

            .footer{
                font-size:12px;
            }

        }

        /* Very Small Phones */
        @media (max-width:360px){

            .login-container{
                padding:20px 15px;
            }

            h1{
                font-size:20px;
            }

            input{
                padding:12px;
            }

            button{
                padding:13px;
            }

        }

    </style>
</head>

<body>

<div class="login-container">

    <h1>Signature Care Collection App</h1>

    <form th:action="@{/login}" method="post">

        <label for="username">Username</label>

        <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required>

        <label for="password">Password</label>

        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>

        <button type="submit">Login</button>

    </form>

    <div class="footer">
        &copy; 2025 Signature Healthcare Limited
    </div>

</div>

</body>
</html>
