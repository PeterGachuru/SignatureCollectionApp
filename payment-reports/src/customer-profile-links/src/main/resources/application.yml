spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/scca
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
    username: root

  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MariaDBDialect
      ddl-auto: update   # <- auto-create/update tables
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

server:
  port: 8080
logging:
  level:
    org:
      thymeleaf: INFO

      springframework:
        web: INFO

mpesa:
  consumer:
    key: your-consumer-key
    secret: your-consumer-secret
  shortcode: your-shortcode
  passkey: your-passkey
  callback:
    url: https://your-callback-url.com
  environment: sandbox # or production

  sandbox:
    oauth: https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
    stk: https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest

  production:
    oauth: https://api.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
    stk: https://api.safaricom.co.ke/mpesa/stkpush/v1/processrequest