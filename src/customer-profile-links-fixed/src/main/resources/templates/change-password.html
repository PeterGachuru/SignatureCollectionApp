<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Change Password</title>
    <th:block th:replace="~{fragments/header :: header-css}"></th:block>
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<h2>Change Password</h2>

<form th:action="@{/profile/change-password}" method="post">
    <label>Current Password:</label><br/>
    <input type="password" name="currentPassword" required /><br/><br/>

    <label>New Password:</label><br/>
    <input type="password" name="newPassword" required /><br/><br/>

    <label>Confirm New Password:</label><br/>
    <input type="password" name="confirmPassword" required /><br/><br/>

    <button type="submit">Update Password</button>
    <p th:if="${error}" th:text="${error}" style="color:red;"></p>
    <p th:if="${success}" th:text="${success}" style="color:green;"></p>

</form>

<a href="/profile">← Back to Profile</a>

</body>
</html>
