<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Credit Sale</title>
    <th:block th:replace="~{fragments/header :: header-css}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}" />

    <style>
        .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
    }

    .modal-content {
        background: #fff;
        width: 80%;
        margin: 5% auto;
        padding: 20px;
        border-radius: 6px;
    }

    .customer-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    .customer-table th,
    .customer-table td {
        border: 1px solid #ddd;
        padding: 8px;
    }

    .customer-table th {
        background: #f4f4f4;
    }

    .customer-table tr:hover {
        background: #f9f9f9;
    }

    .modal-actions {
        text-align: right;
        margin-top: 10px;
    }
    </style>
</head>

<body>

<div th:replace="fragments/header :: header"></div>

<h2>Create Credit Sale</h2>

<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

<form th:action="@{/credit-sales/save}" method="post">

    <!-- Selected customer -->
    <input type="hidden" name="customerId" id="customerId" required>

    <label>Customer</label>
    <input type="text"
           id="customerName"
           readonly
           placeholder="Click Search to select customer"
           style="background:#f3f3f3;">

    <button type="button" onclick="openCustomerModal()">Search</button>

    <br/><br/>

    <label>Gross amount *</label>
    <input type="number" name="grossAmount" step="0.01" required>

    <br/><br/>

    <label>Discount *</label>
    <input type="number" name="discount" value="0" step="0.01" required>

    <br/><br/>
    <label>Invoice Amount *</label>
    <input type="number" name="invoiceAmount" step="0.01" required>

    <br/><br/>

    <label>Sale Date</label>
    <input type="date" name="saleDate" th:value="${today}">

    <br/><br/>

    <label>Description</label>
    <textarea name="description"></textarea>

    <br/><br/>

    <button type="submit"
            onclick="return document.getElementById('customerId').value !== ''">
        Save Credit Sale
    </button>


</form>

<!-- Reusable Customer Modal -->
<div th:replace="fragments/customer-modal :: customerModal(${customers})"></div>

</body>
</html>
