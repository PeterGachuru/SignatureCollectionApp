<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Credit Sale Details</title>

    <th:block th:replace="~{fragments/header :: header-css}"></th:block>

    <style>
        .container { max-width: 1000px; margin: auto; }
        .card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            background: #fff;
        }
        .row { display: flex; flex-wrap: wrap; }
        .col { flex: 1; min-width: 200px; margin-bottom: 10px; }
        label { font-weight: bold; display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f4f4f4; }
        .status { padding: 4px 8px; border-radius: 4px; color: white; }
        .CURRENT { background: orange; }
        .PAID { background: green; }
        .OVERDUE { background: red; }
    </style>
</head>

<body>

<div th:replace="fragments/header :: header"></div>

<div class="container">

    <h2>Credit Sale Details</h2>

    <!-- CREDIT SALE INFO -->
    <div class="card">
        <h3>Sale Information</h3>

        <div class="row">
            <div class="col">
                <label>Customer Name</label>
                <a th:href="@{/admin/customers/view/{customerId}(customerId=${cs.customerId})}"
                   th:text="${cs.customerName}"
                   style="font-weight:600; color:#2196F3; text-decoration:none;"></a>
            </div>

            <div class="col">
                <label>Customer Code</label>
                <a th:href="@{/admin/customers/view/{customerId}(customerId=${cs.customerId})}"
                   th:text="${cs.customerCode}"
                   style="color:#2196F3; text-decoration:none;"></a>
            </div>

            <div class="col">
                <label>Status</label>
                <span th:text="${cs.status}"
                      th:class="'status ' + ${cs.status}"></span>
            </div>

            <div class="col">
                <label>Classification</label>
                <span th:text="${cs.classificationName}"></span>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Invoice Amount</label>
                <span th:text="${#numbers.formatDecimal(cs.invoiceAmount,1,'COMMA',2,'POINT')}"></span>
            </div>

            <div class="col">
                <label>Amount Paid</label>
                <span th:text="${#numbers.formatDecimal(cs.amount - cs.balance,1,'COMMA',2,'POINT')}"></span>
            </div>

            <div class="col">
                <label>Balance</label>
                <span th:text="${#numbers.formatDecimal(cs.balance,1,'COMMA',2,'POINT')}"></span>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Sale Date</label>
                <span th:text="${cs.saleDate}"></span>
            </div>

            <div class="col">
                <label>Description</label>
                <span th:text="${cs.description}"></span>
            </div>
        </div>
    </div>

    <!-- AUDIT INFO -->
    <div class="card">
        <h3>Audit Information</h3>

        <div class="row">
            <div class="col">
                <label>Created At</label>
                <span th:text="${cs.createdAt}"></span>
            </div>

            <div class="col">
                <label>Created By</label>
                <span th:text="${cs.createdBy}"></span>
            </div>
        </div>
    </div>

    <!-- PAYMENTS -->
    <div class="card">
        <h3>Payment History</h3>

        <table>
            <thead>
            <tr>
                <th>Payment Date</th>
                <th>Reference</th>
                <th>Phone</th>
                <th>Mode</th>
                <th>Total Payment</th>
                <th>Amount Applied</th>
            </tr>
            </thead>
            <tbody>

            <tr th:if="${#lists.isEmpty(cs.paymentSplits)}">
                <td colspan="6" style="text-align:center;">No payments yet</td>
            </tr>

            <tr th:each="ps : ${cs.paymentSplits}">
                <td th:text="${ps.paymentDate}"></td>
                <td th:text="${ps.paymentReference}"></td>
                <td th:text="${ps.phoneNumber}"></td>
                <td th:text="${ps.paymentMode}"></td>
                <td th:text="${#numbers.formatDecimal(ps.paymentAmount,1,'COMMA',2,'POINT')}"></td>
                <td th:text="${#numbers.formatDecimal(ps.amountApplied,1,'COMMA',2,'POINT')}"></td>
            </tr>

            </tbody>
        </table>

    </div>

</div>

</body>
</html>
